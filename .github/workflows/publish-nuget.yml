name: Publish to NuGet

on:
  push:
    tags:
      - 'nuget-v*'
  workflow_dispatch:

jobs:
  publish:
    name: Pack & Publish DeviceSpecs.Mcp
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore dotnet/DeviceSpecs.Mcp/DeviceSpecs.Mcp.csproj

      - name: Build
        run: dotnet build dotnet/DeviceSpecs.Mcp/DeviceSpecs.Mcp.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack dotnet/DeviceSpecs.Mcp/DeviceSpecs.Mcp.csproj -c Release --no-build -o out

      - name: Push to NuGet.org
        run: dotnet nuget push out/*.nupkg --api-key ${{ secrets.NUGET_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
